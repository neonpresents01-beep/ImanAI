<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImanAI | تماس با ما</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">🤖 ImanAI</a>
        <div class="nav-links">
            <a href="index.html">خانه</a>
            <a href="products.html">محصولات</a>
            <a href="pricing.html">قیمت‌ها</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html" class="active">تماس</a>
            <a href="dashboard.html">پنل کاربری</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 حالت شب</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <h1>📞 تماس با ما</h1>
        <p>ما همیشه آماده پاسخگویی به شما هستیم</p>
    </div>

    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        <div class="card" style="text-align: center;">
            <i class="fas fa-phone-alt" style="font-size: 48px; color: var(--primary);"></i>
            <h3>تلفن پشتیبانی</h3>
            <p style="font-size: 20px; direction: ltr;">۰۹۹۳۷۰۶۰۴۴۷</p>
            <button class="btn" onclick="copyPhone()" style="margin-top: 10px;">📋 کپی شماره</button>
        </div>
        <div class="card" style="text-align: center;">
            <i class="fas fa-credit-card" style="font-size: 48px; color: var(--primary);"></i>
            <h3>شماره کارت</h3>
            <p style="font-size: 18px; direction: ltr;">۵۸۹۲ ۱۰۱۷ ۳۰۸۲ ۸۸۳۳</p>
            <button class="btn" onclick="copyCard()" style="margin-top: 10px;">📋 کپی شماره کارت</button>
        </div>
        <div class="card" style="text-align: center;">
            <i class="fab fa-telegram" style="font-size: 48px; color: var(--primary);"></i>
            <h3>پشتیبانی تلگرام</h3>
            <p>@ImanAI_support</p>
            <a href="https://t.me/ImanAI_support" target="_blank" class="btn" style="display: inline-block; margin-top: 10px;">ارسال پیام</a>
        </div>
        <div class="card" style="text-align: center;">
            <i class="fas fa-envelope" style="font-size: 48px; color: var(--primary);"></i>
            <h3>ایمیل</h3>
            <p>info@imanai.ir</p>
            <button class="btn" onclick="copyEmail()" style="margin-top: 10px;">📋 کپی ایمیل</button>
        </div>
    </div>

    <!-- فرم تماس -->
    <div class="card" style="margin-top: 20px;">
        <h2 style="margin-bottom: 20px;">✉️ ارسال پیام</h2>
        <form id="contactForm" onsubmit="sendMessage(event)">
            <div class="form-group">
                <label>نام و نام خانوادگی</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>موضوع</label>
                <input type="text" id="subject" required>
            </div>
            <div class="form-group">
                <label>پیام</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">ارسال پیام</button>
        </form>
        <div id="formResult" style="margin-top: 15px;"></div>
    </div>
</div>

<div class="footer">
    <p>© ۲۰۲۶ ImanAI - سامانه حسابداری هوشمند</p>
</div>

<script src="imanai-client.js"></script>
<script>
    function copyCard() {
        navigator.clipboard.writeText('5892101730828833');
        alert('✅ شماره کارت کپی شد!');
    }
    function copyPhone() {
        navigator.clipboard.writeText('09937060447');
        alert('✅ شماره تماس کپی شد!');
    }
    function copyEmail() {
        navigator.clipboard.writeText('info@imanai.ir');
        alert('✅ ایمیل کپی شد!');
    }

    function sendMessage(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        
        document.getElementById('formResult').innerHTML = '<div class="alert alert-success">✅ پیام شما با موفقیت ارسال شد. به زودی با شما تماس می‌گیریم.</div>';
        document.getElementById('contactForm').reset();
        
        setTimeout(() => {
            document.getElementById('formResult').innerHTML = '';
        }, 5000);
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.innerHTML = document.body.classList.contains('dark') ? '☀️ حالت روز' : '🌙 حالت شب';
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.innerHTML = '☀️ حالت روز';
    }
</script>
</body>
</html>
