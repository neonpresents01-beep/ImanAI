<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImanAI | پنل کاربری</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            background: var(--bg-primary);
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .user-msg {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            max-width: 80%;
        }
        .ai-msg {
            background: var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            max-width: 80%;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .api-key-box {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            word-break: break-all;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">🤖 ImanAI</a>
        <div class="nav-links">
            <a href="index.html">خانه</a>
            <a href="products.html">محصولات</a>
            <a href="pricing.html">قیمت‌ها</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس</a>
            <a href="dashboard.html" class="active">پنل کاربری</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 حالت شب</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <h1>👤 پنل کاربری</h1>
        <p>مدیریت API Key، اعتبار و گفتگو با ImanAI</p>
    </div>

    <div id="userStatus">
        <div class="card" style="text-align: center;">
            <p id="loginStatus">⏳ در حال بررسی...</p>
            <button id="logoutBtn" class="btn" onclick="logout()" style="display: none; background: #ef4444;">🚪 خروج</button>
        </div>
    </div>

    <div id="dashboardContent" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-key"></i>
                <div class="stat-value" id="apiKeyDisplay">---</div>
                <button class="btn" style="margin-top: 10px; padding: 8px 16px;" onclick="copyApiKey()">📋 کپی</button>
            </div>
            <div class="stat-card">
                <i class="fas fa-coins"></i>
                <div class="stat-value" id="creditsDisplay">---</div>
                <button class="btn" style="margin-top: 10px; padding: 8px 16px;" onclick="recharge()">💰 شارژ</button>
            </div>
            <div class="stat-card">
                <i class="fas fa-tag"></i>
                <div class="stat-value" id="planDisplay">---</div>
                <p>پلن</p>
            </div>
        </div>

        <div class="card">
            <h3>💬 گفتگو با ImanAI</h3>
            <div class="chat-messages" id="chatMessages">
                <div class="ai-msg">🤖 سلام! من ImanAI هستم.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="سوال خود را بپرسید...">
                <button onclick="sendChat()">ارسال</button>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>🎓 آموزش به ImanAI</h3>
            <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                <input type="text" id="trainQuestion" placeholder="سوال جدید..." style="flex: 1; padding: 12px; border-radius: 50px;">
                <input type="text" id="trainAnswer" placeholder="پاسخ..." style="flex: 1; padding: 12px; border-radius: 50px;">
                <button onclick="trainAI()" style="background: #10b981;">آموزش</button>
            </div>
            <div id="trainResult" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div id="registerForm" class="card" style="max-width: 500px; margin: 0 auto;">
        <h2 style="text-align: center;">📝 ثبت‌نام</h2>
        <div class="form-group">
            <label>نام</label>
            <input type="text" id="regName" placeholder="نام خود را وارد کنید">
        </div>
        <div class="form-group">
            <label>ایمیل</label>
            <input type="email" id="regEmail" placeholder="ایمیل خود را وارد کنید">
        </div>
        <div class="form-group">
            <label>پلن</label>
            <select id="regPlan">
                <option value="free">رایگان</option>
                <option value="basic">پایه</option>
                <option value="pro">حرفه‌ای</option>
            </select>
        </div>
        <button class="btn" id="registerBtn" style="width: 100%;">✅ ثبت‌نام</button>
    </div>
</div>

<div class="footer">
    <p>© ۲۰۲۶ ImanAI</p>
</div>

<script>
    const GITHUB_REPO = "neonpresents01-beep/ImanAI";
    const GITHUB_TOKEN = "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";
    
    let currentApiKey = localStorage.getItem('imanai_api_key');
    
    async function callAPI(action, payload = {}) {
        const requestId = Date.now().toString();
        
        return new Promise(async (resolve, reject) => {
            const timeout = setTimeout(() => {
                reject(new Error('Timeout'));
            }, 15000);
            
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: action,
                        client_payload: { ...payload, api_key: currentApiKey || '' }
                    })
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                // Polling
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    const runs = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/runs?per_page=3`);
                    const data = await runs.json();
                    
                    for (const run of (data.workflow_runs || [])) {
                        if (run.status === 'completed') {
                            const logs = await fetch(run.logs_url);
                            const text = await logs.text();
                            const match = text.match(/API_RESPONSE::(.+)/);
                            if (match) {
                                clearInterval(interval);
                                clearTimeout(timeout);
                                resolve(JSON.parse(decodeURIComponent(match[1])));
                                return;
                            }
                        }
                    }
                    if (attempts > 10) {
                        clearInterval(interval);
                        reject(new Error('No response'));
                    }
                }, 1500);
                
            } catch (error) {
                clearTimeout(timeout);
                reject(error);
            }
        });
    }
    
    async function register() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const plan = document.getElementById('regPlan').value;
        const btn = document.getElementById('registerBtn');
        
        if (!name || !email) {
            alert('لطفاً نام و ایمیل را وارد کنید');
            return;
        }
        
        btn.innerText = '⏳ در حال ثبت‌نام...';
        btn.disabled = true;
        
        try {
            const result = await callAPI('register', { customer_name: name, customer_email: email, plan });
            if (result.success) {
                currentApiKey = result.api_key;
                localStorage.setItem('imanai_api_key', currentApiKey);
                alert(`✅ ثبت‌نام موفق!\n\nAPI Key: ${result.api_key}\nاعتبار: ${result.credits}`);
                location.reload();
            } else {
                alert(`❌ خطا: ${result.error}`);
            }
        } catch (error) {
            alert(`❌ خطا: ${error.message}`);
        } finally {
            btn.innerText = '✅ ثبت‌نام';
            btn.disabled = false;
        }
    }
    
    async function sendChat() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        
        const messages = document.getElementById('chatMessages');
        messages.innerHTML += `<div class="user-msg">👤 شما: ${msg}</div>`;
        input.value = '';
        
        try {
            const result = await callAPI('chat', { message: msg });
            if (result.success) {
                messages.innerHTML += `<div class="ai-msg">🤖 ImanAI: ${result.response}</div>`;
                document.getElementById('creditsDisplay').innerHTML = result.remaining_credits;
            } else {
                messages.innerHTML += `<div class="ai-msg">❌ ${result.error}</div>`;
            }
        } catch(e) {
            messages.innerHTML += `<div class="ai-msg">❌ خطا: ${e.message}</div>`;
        }
        messages.scrollTop = messages.scrollHeight;
    }
    
    async function trainAI() {
        const q = document.getElementById('trainQuestion').value;
        const a = document.getElementById('trainAnswer').value;
        const resultDiv = document.getElementById('trainResult');
        
        if (!q || !a) {
            resultDiv.innerHTML = '❌ سوال و پاسخ را وارد کنید';
            return;
        }
        
        resultDiv.innerHTML = '⏳ در حال آموزش...';
        try {
            const result = await callAPI('train', { question: q, answer: a });
            if (result.success) {
                resultDiv.innerHTML = `✅ ${result.message}`;
                document.getElementById('trainQuestion').value = '';
                document.getElementById('trainAnswer').value = '';
                document.getElementById('creditsDisplay').innerHTML = result.remaining_credits;
            } else {
                resultDiv.innerHTML = `❌ ${result.error}`;
            }
        } catch(e) {
            resultDiv.innerHTML = `❌ ${e.message}`;
        }
        setTimeout(() => resultDiv.innerHTML = '', 3000);
    }
    
    async function getBalance() {
        if (!currentApiKey) return;
        try {
            const result = await callAPI('balance', {});
            if (result.success) {
                document.getElementById('creditsDisplay').innerHTML = result.credits;
                document.getElementById('planDisplay').innerHTML = result.plan;
                document.getElementById('apiKeyDisplay').innerHTML = currentApiKey.substring(0, 16) + '...';
            }
        } catch(e) {}
    }
    
    function logout() {
        localStorage.removeItem('imanai_api_key');
        location.reload();
    }
    
    function copyApiKey() {
        if (currentApiKey) {
            navigator.clipboard.writeText(currentApiKey);
            alert('✅ کپی شد!');
        }
    }
    
    function recharge() {
        alert('به زودی');
    }
    
    function updateUI() {
        if (currentApiKey) {
            document.getElementById('loginStatus').innerHTML = '✅ وارد شده‌اید';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('dashboardContent').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            getBalance();
        } else {
            document.getElementById('loginStatus').innerHTML = '🔑 ثبت‌نام کنید';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    }
    
    document.getElementById('registerBtn')?.addEventListener('click', register);
    document.getElementById('chatInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChat();
    });
    
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    
    updateUI();
</script>
</body>
    </html>
