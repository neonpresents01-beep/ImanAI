<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ImanAI | پنل کاربری</title>
    <style>
        body { font-family: Tahoma; background: #0f172a; color: white; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; }
        button { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; border-radius: 8px; }
        .success { background: #10b981; }
        .error { background: #ef4444; }
        #chatMessages { height: 300px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div style="max-width: 600px; margin: 0 auto;">
    <h1>🤖 ImanAI - پنل کاربری</h1>
    
    <!-- وضعیت API -->
    <div id="apiStatus" style="background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        🔄 در حال اتصال به سرویس...
    </div>

    <div id="registerBox" class="card">
        <h3>📝 ثبت‌نام</h3>
        <input type="text" id="name" placeholder="نام">
        <input type="email" id="email" placeholder="ایمیل">
        <select id="plan">
            <option value="free">رایگان (100 اعتبار)</option>
            <option value="basic">پایه (500 اعتبار)</option>
            <option value="pro">حرفه‌ای (2000 اعتبار)</option>
        </select>
        <button onclick="register()">✅ ثبت‌نام</button>
        <div id="registerResult"></div>
    </div>

    <div id="dashboardBox" class="card" style="display: none;">
        <h3>🔑 API Key شما</h3>
        <p id="apiKeyDisplay" style="font-family: monospace; word-break: break-all; background: #0f172a; padding: 10px; border-radius: 8px;"></p>
        <button onclick="copyApiKey()">📋 کپی</button>
        
        <h3>💰 اعتبار باقی‌مانده</h3>
        <p id="creditsDisplay" style="font-size: 24px; font-weight: bold; color: #10b981;">0</p>
        <p>پلن: <span id="planDisplay">-</span></p>
        
        <h3>💬 چت با ImanAI</h3>
        <div id="chatMessages">
            <div>🤖 سلام! من ImanAI هستم. سوال خود را بپرسید.</div>
        </div>
        <input type="text" id="chatInput" placeholder="سوال خود را بپرسید...">
        <button onclick="sendChat()">ارسال</button>
        
        <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">🚪 خروج</button>
    </div>
</div>

<script src="imanai-client.js"></script>
</body>
</html>
