name: ImanAI Cloud API

on:
  repository_dispatch:
    types: [chat, train, predict, analyze]
  workflow_dispatch:
    inputs:
      action:
        description: 'نوع عملیات'
        required: true
        default: 'chat'
        type: choice
        options:
          - chat
          - train
          - status
      message:
        description: 'پیام (برای chat)'
        required: false
        default: 'سلام'

jobs:
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: دریافت کد از ریپازیتوری
        uses: actions/checkout@v4
      
      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: نصب پیش‌نیازها
        run: |
          pip install numpy scipy
      
      - name: راه‌اندازی ImanAI و پردازش درخواست
        env:
          ACTION_TYPE: ${{ github.event.action }}
          USER_MESSAGE: ${{ github.event.client_payload.message || github.event.inputs.message }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          python -c "
import sys, json, urllib.parse, time, os

sys.path.insert(0, '.')

class ImanAIModel:
    def __init__(self):
        self.knowledge = {
            'سلام': '👋 سلام! من ImanAI هستم، دستیار هوشمند شما.',
            'خوبی': '🙂 ممنون! من همیشه آماده کمک هستم.',
            'اسمت': '🤖 اسم من ImanAI هست.',
            'چه کاری میتونی': 'میتونم به سوالات مالی پاسخ بدم، موجودی حساب رو بگم، سود و زیان رو گزارش بدم.',
            'موجودی صندوق': '💰 موجودی صندوق: ۱۵,۳۲۰,۰۰۰ ریال',
            'موجودی بانک': '🏦 موجودی بانک: ۸۲,۴۵۰,۰۰۰ ریال',
            'فروش امروز': '📈 فروش امروز: ۳,۲۰۰,۰۰۰ ریال',
            'راهنما': 'سوالات قابل پرسش: سلام, خوبی, موجودی صندوق, موجودی بانک, فروش امروز, سود و زیان',
            'خداحافظ': '👋 خداحافظ!'
        }
    
    def chat(self, message):
        msg_lower = message.lower().strip()
        for key, response in self.knowledge.items():
            if key in msg_lower:
                return response
        return f'🤖 دریافت شد: {message[:100]}... (برای راهنما بگید \"راهنما\")'

ai = ImanAIModel()

action = os.environ.get('ACTION_TYPE', '')
message = os.environ.get('USER_MESSAGE', '')

result = {}

if action == 'chat':
    response = ai.chat(message)
    result = {'response': response, 'action': 'chat'}

elif action == 'status':
    result = {'status': 'online', 'actions': ['chat', 'status']}

else:
    result = {'error': f'Unknown action: {action}', 'available': ['chat', 'status']}

output = urllib.parse.quote(json.dumps(result))
print(f'RESPONSE::{output}')
"
      
      - name: برگرداندن پاسخ
        run: |
          echo "response=ok" >> $GITHUB_OUTPUT
