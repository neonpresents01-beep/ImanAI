name: ImanAI Cloud API

on:
  repository_dispatch:
    types: [chat, analyze, train, status]
  workflow_dispatch:
    inputs:
      action:
        description: 'نوع عملیات'
        required: true
        default: 'chat'
        type: choice
        options:
          - chat
          - analyze
          - status
      message:
        description: 'پیام'
        required: false
        default: 'سلام'

jobs:
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install numpy
      
      - name: Run ImanAI
        env:
          ACTION: ${{ github.event.action }}
          MESSAGE: ${{ github.event.client_payload.message || github.event.inputs.message }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          python -c "
import sys, json, urllib.parse, time, os

# ========== ImanAI Core ==========
class ImanAI:
    def __init__(self):
        self.knowledge = {
            'سلام': '👋 سلام! من ImanAI هستم، دستیار هوشمند شما.',
            'خوبی': '🙂 ممنون! من همیشه آماده کمک هستم.',
            'اسمت': '🤖 اسم من ImanAI هست، دستیار هوشمند حسابداری.',
            'چه کاری میتونی': self._get_abilities(),
            'موجودی صندوق': '💰 موجودی صندوق: ۱۵,۳۲۰,۰۰۰ ریال',
            'موجودی بانک': '🏦 موجودی بانک: ۸۲,۴۵۰,۰۰۰ ریال',
            'فروش امروز': '📈 فروش امروز: ۳,۲۰۰,۰۰۰ ریال',
            'فروش این ماه': '📊 فروش این ماه: ۴۵,۲۰۰,۰۰۰ ریال',
            'سود و زیان': self._get_profit_loss(),
            'کاربران فعال': '👥 تعداد کاربران فعال: ۵,۰۰۰+',
            'نسخه': '📦 نسخه ImanAI: 2.6.0',
            'راهنما': self._get_help(),
            'خداحافظ': '👋 خداحافظ! خوشحال بودم که تونستم کمکت کنم.',
            'تشکر': '🌹 خواهش میکنم! هر وقت نیاز داشتید، من هستم.',
            'پشتیبانی': '📞 برای پشتیبانی با شماره ۰۹۹۳۷۰۶۰۴۴۷ تماس بگیرید یا به @ImanAI_support در تلگرام پیام بدید.'
        }
        self.conversations = []
    
    def _get_abilities(self):
        return """✨ **قابلیت‌های من:**

📊 **سوالات مالی:**
• موجودی صندوق
• موجودی بانک
• فروش امروز / این ماه
• سود و زیان

🎤 **قابلیت‌های ویژه:**
• تشخیص گفتار (آفلاین)
• تحلیل احساسات
• پاسخ هوشمند

💡 برای راهنما بگویید «راهنما»"""
    
    def _get_profit_loss(self):
        return """📊 **گزارش سود و زیان دوره جاری**

💰 **درآمد کل:** ۱۲۵,۰۰۰,۰۰۰ ریال
💸 **هزینه کل:** ۸۹,۰۰۰,۰۰۰ ریال
📈 **سود ناخالص:** ۳۶,۰۰۰,۰۰۰ ریال
✅ **سود خالص:** ۲۸,۵۰۰,۰۰۰ ریال

📊 **حاشیه سود:** ۲۲.۸%"""
    
    def _get_help(self):
        return """📚 **راهنمای ImanAI**

**سوالات مالی:**
• موجودی صندوق - نمایش موجودی نقد
• موجودی بانک - نمایش موجودی بانک
• فروش امروز - فروش روز جاری
• فروش این ماه - فروش ماه جاری
• سود و زیان - گزارش سود و زیان

**سوالات عمومی:**
• سلام - معرفی
• اسمت - نام من
• چه کاری میتونی - قابلیت‌ها
• نسخه - نسخه فعلی
• پشتیبانی - اطلاعات تماس
• خداحافظ - پایان گفتگو

💡 **نکته:** سوالات خود را به فارسی بپرسید!"""
    
    def analyze_sentiment(self, text):
        """تحلیل احساسات متن"""
        text_lower = text.lower()
        positive = ['خوب', 'عالی', 'عشق', 'عالیه', 'ممنون', 'دوست', 'عالیست']
        negative = ['بد', 'خراب', 'اشتباه', 'مشکل', 'ناراحت', 'بدک', 'خرابه']
        
        pos_score = sum(1 for w in positive if w in text_lower)
        neg_score = sum(1 for w in negative if w in text_lower)
        
        if pos_score > neg_score:
            return 'مثبت', 0.7 + (pos_score * 0.05)
        elif neg_score > pos_score:
            return 'منفی', 0.6 + (neg_score * 0.05)
        else:
            return 'خنثی', 0.5
    
    def chat(self, message):
        """پاسخ به پیام کاربر"""
        msg_lower = message.lower().strip()
        
        # ذخیره در تاریخچه
        self.conversations.append({
            'time': time.time(),
            'user': message[:100],
            'response': None
        })
        
        # جستجو در دانش
        for key, response in self.knowledge.items():
            if key in msg_lower:
                self.conversations[-1]['response'] = response
                return response
        
        # تحلیل احساسات
        sentiment, confidence = self.analyze_sentiment(message)
        
        # پاسخ پیشفرض
        response = f"🤖 پیام شما دریافت شد: «{message[:100]}»\n\n💡 {self._get_hint()}"
        self.conversations[-1]['response'] = response
        return response
    
    def _get_hint(self):
        return """برای راهنما «راهنما» را بپرسید.
سوالات قابل پرسش: موجودی صندوق، موجودی بانک، فروش امروز، سود و زیان"""
    
    def get_stats(self):
        return {
            'knowledge_size': len(self.knowledge),
            'conversations': len(self.conversations),
            'version': '2.6.0',
            'status': 'online'
        }

# ========== راه‌اندازی ==========
ai = ImanAI()
print('🧠 ImanAI Cloud API is running', file=sys.stderr)

# ========== پردازش درخواست ==========
action = os.environ.get('ACTION', '')
message = os.environ.get('MESSAGE', '')
request_id = os.environ.get('REQUEST_ID', str(int(time.time())))

result = {
    'request_id': request_id,
    'timestamp': int(time.time()),
    'action': action
}

if action == 'chat':
    response = ai.chat(message)
    result['response'] = response
    result['sentiment'], result['confidence'] = ai.analyze_sentiment(message)
    result['stats'] = ai.get_stats()
    print('✅ Chat processed', file=sys.stderr)

elif action == 'analyze':
    sentiment, confidence = ai.analyze_sentiment(message)
    result['sentiment'] = sentiment
    result['confidence'] = confidence
    result['text'] = message[:200]
    print('✅ Analysis processed', file=sys.stderr)

elif action == 'status':
    result['status'] = 'online'
    result['stats'] = ai.get_stats()
    result['available_actions'] = ['chat', 'analyze', 'status']
    print('✅ Status checked', file=sys.stderr)

else:
    result['error'] = f'Unknown action: {action}'
    result['available_actions'] = ['chat', 'analyze', 'status']
    print(f'⚠️ Unknown action: {action}', file=sys.stderr)

# ========== خروجی ==========
encoded_result = urllib.parse.quote(json.dumps(result, ensure_ascii=False))
print(f'IMANAI_RESPONSE::{encoded_result}')
"
      
      - name: Return response
        run: |
          echo "response=ok" >> $GITHUB_OUTPUT
          echo "✅ ImanAI Cloud API executed successfully"
