name: ImanAI API

on:
  repository_dispatch:
    types: [register, chat, train, balance]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Run API Handler
        env:
          ACTION: ${{ github.event.action }}
          API_KEY: ${{ github.event.client_payload.api_key }}
          USER_NAME: ${{ github.event.client_payload.customer_name }}
          USER_EMAIL: ${{ github.event.client_payload.customer_email }}
          USER_PLAN: ${{ github.event.client_payload.plan }}
          USER_MESSAGE: ${{ github.event.client_payload.message }}
          TRAIN_QUESTION: ${{ github.event.client_payload.question }}
          TRAIN_ANSWER: ${{ github.event.client_payload.answer }}
        run: |
          python -c "
import json
import urllib.parse
import os
import hashlib
import uuid
import time

USERS_FILE = 'users.json'
KNOWLEDGE_FILE = 'knowledge.json'

def load_users():
    try:
        with open(USERS_FILE, 'r') as f:
            return json.load(f)
    except:
        return {}

def save_users(users):
    with open(USERS_FILE, 'w') as f:
        json.dump(users, f, indent=2)

def load_knowledge():
    default = {'سلام': '👋 سلام! من ImanAI هستم.'}
    try:
        with open(KNOWLEDGE_FILE, 'r') as f:
            saved = json.load(f)
            default.update(saved)
    except:
        pass
    return default

def save_knowledge(knowledge):
    with open(KNOWLEDGE_FILE, 'w') as f:
        json.dump(knowledge, f, ensure_ascii=False, indent=2)

def hash_key(key):
    return hashlib.sha256(key.encode()).hexdigest()

def generate_api_key():
    return f'imanai_{uuid.uuid4().hex[:16]}'

action = os.environ.get('ACTION', '')
api_key = os.environ.get('API_KEY', '')
name = os.environ.get('USER_NAME', '')
email = os.environ.get('USER_EMAIL', '')
plan = os.environ.get('USER_PLAN', 'free')
message = os.environ.get('USER_MESSAGE', '')
question = os.environ.get('TRAIN_QUESTION', '')
answer = os.environ.get('TRAIN_ANSWER', '')

users = load_users()
knowledge = load_knowledge()
result = {}

if action == 'register':
    new_key = generate_api_key()
    hashed = hash_key(new_key)
    users[hashed] = {
        'name': name,
        'email': email,
        'plan': plan,
        'credits': 10000,
        'created_at': time.time()
    }
    save_users(users)
    result = {'success': True, 'api_key': new_key, 'credits': 10000, 'plan': plan}

elif action == 'chat':
    if not api_key:
        result = {'success': False, 'error': 'API Key required'}
    else:
        hashed = hash_key(api_key)
        if hashed not in users:
            result = {'success': False, 'error': 'Invalid API Key'}
        elif users[hashed]['credits'] <= 0:
            result = {'success': False, 'error': 'Insufficient credits'}
        else:
            users[hashed]['credits'] -= 1
            save_users(users)
            msg_lower = message.lower()
            response = None
            for key, resp in knowledge.items():
                if key in msg_lower:
                    response = resp
                    break
            if not response:
                response = f'دریافت شد: {message[:100]}...'
            result = {'success': True, 'response': response, 'remaining_credits': users[hashed]['credits']}

elif action == 'balance':
    if not api_key:
        result = {'success': False, 'error': 'API Key required'}
    else:
        hashed = hash_key(api_key)
        if hashed not in users:
            result = {'success': False, 'error': 'Invalid API Key'}
        else:
            result = {'success': True, 'credits': users[hashed]['credits'], 'plan': users[hashed]['plan']}

else:
    result = {'error': f'Unknown action: {action}'}

encoded = urllib.parse.quote(json.dumps(result))
print(f'API_RESPONSE::{encoded}')
"
      
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imanai-data
          path: |
            users.json
            knowledge.json        run: |
          pip install numpy scipy
      
      - name: راه‌اندازی ImanAI و پردازش درخواست
        env:
          ACTION_TYPE: ${{ github.event.action }}
          USER_MESSAGE: ${{ github.event.client_payload.message || github.event.inputs.message }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          python -c "
import sys, json, urllib.parse, time, os

sys.path.insert(0, '.')

class ImanAIModel:
    def __init__(self):
        self.knowledge = {
            'سلام': '👋 سلام! من ImanAI هستم، دستیار هوشمند شما.',
            'خوبی': '🙂 ممنون! من همیشه آماده کمک هستم.',
            'اسمت': '🤖 اسم من ImanAI هست.',
            'چه کاری میتونی': 'میتونم به سوالات مالی پاسخ بدم، موجودی حساب رو بگم، سود و زیان رو گزارش بدم.',
            'موجودی صندوق': '💰 موجودی صندوق: ۱۵,۳۲۰,۰۰۰ ریال',
            'موجودی بانک': '🏦 موجودی بانک: ۸۲,۴۵۰,۰۰۰ ریال',
            'فروش امروز': '📈 فروش امروز: ۳,۲۰۰,۰۰۰ ریال',
            'راهنما': 'سوالات قابل پرسش: سلام, خوبی, موجودی صندوق, موجودی بانک, فروش امروز, سود و زیان',
            'خداحافظ': '👋 خداحافظ!'
        }
    
    def chat(self, message):
        msg_lower = message.lower().strip()
        for key, response in self.knowledge.items():
            if key in msg_lower:
                return response
        return f'🤖 دریافت شد: {message[:100]}... (برای راهنما بگید \"راهنما\")'

ai = ImanAIModel()

action = os.environ.get('ACTION_TYPE', '')
message = os.environ.get('USER_MESSAGE', '')

result = {}

if action == 'chat':
    response = ai.chat(message)
    result = {'response': response, 'action': 'chat'}

elif action == 'status':
    result = {'status': 'online', 'actions': ['chat', 'status']}

else:
    result = {'error': f'Unknown action: {action}', 'available': ['chat', 'status']}

output = urllib.parse.quote(json.dumps(result))
print(f'RESPONSE::{output}')
"
      
      - name: برگرداندن پاسخ
        run: |
          echo "response=ok" >> $GITHUB_OUTPUT          python-version: '3.10'
      
      - name: 📦 نصب پیش‌نیازها
        run: |
          pip install numpy scipy
          # اگر نیاز به کتابخونه دیگه‌ای بود اضافه کن
      
      - name: 🧠 راه‌اندازی ImanAI و پردازش درخواست
        env:
          ACTION_TYPE: ${{ github.event.action }}
          USER_MESSAGE: ${{ github.event.client_payload.message || github.event.inputs.message }}
          TRAIN_DATA: ${{ github.event.client_payload.train_data }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          python -c "
import sys, json, urllib.parse, time, hashlib, os
import numpy as np

# ========== اضافه کردن مسیر ImanAILite ==========
sys.path.insert(0, '.')

# ========== مدل هوش مصنوعی ImanAI ==========
class ImanAIModel:
    """مدل هوش مصنوعی ImanAI - با قابلیت یادگیری"""
    
    def __init__(self):
        self.knowledge = {
            'سلام': '👋 سلام! من ImanAI هستم، دستیار هوشمند شما.',
            'خوبی': '🙂 ممنون! من همیشه آماده کمک هستم.',
            'اسمت': '🤖 اسم من ImanAI هست.',
            'چه کاری میتونی': self._get_capabilities(),
            'موجودی صندوق': '💰 موجودی صندوق: ۱۵,۳۲۰,۰۰۰ ریال',
            'موجودی بانک': '🏦 موجودی بانک: ۸۲,۴۵۰,۰۰۰ ریال',
            'فروش امروز': '📈 فروش امروز: ۳,۲۰۰,۰۰۰ ریال',
            'سود و زیان': self._get_profit_loss(),
            'راهنما': self._get_help(),
            'خداحافظ': '👋 خداحافظ! خوشحال بودم که تونستم کمک کنم.'
        }
        self.conversation_history = []
        self.model_trained = False
        self.model_weights = {}
        
        # تلاش برای بارگذاری ImanAILite واقعی
        try:
            from ImanAILite import ImanAILite
            self.ai_lite = ImanAILite(verbose=False)
            self.has_ai_lite = True
            print('✅ ImanAILite loaded')
        except Exception as e:
            print(f'⚠️ ImanAILite not available: {e}')
            self.has_ai_lite = False
    
    def _get_capabilities(self):
        return """✨ **قابلیت‌های من:**

1. 📊 پاسخ به سوالات مالی
2. 💰 نمایش موجودی حساب‌ها
3. 📈 گزارش سود و زیان
4. 🎤 تشخیص فرمان صوتی
5. 📚 یادگیری از تعاملات

برای مشاهده راهنما، بگویید «راهنما»"""
    
    def _get_profit_loss(self):
        return """📊 **گزارش سود و زیان**

💰 درآمد کل: ۱۲۵,۰۰۰,۰۰۰ ریال
💸 هزینه کل: ۸۹,۰۰۰,۰۰۰ ریال

✅ **سود خالص: ۳۶,۰۰۰,۰۰۰ ریال**"""
    
    def _get_help(self):
        return """📚 **راهنمای ImanAI**

**سوالات مالی:**
• موجودی صندوق
• موجودی بانک
• فروش امروز
• سود و زیان

**سوالات عمومی:**
• سلام
• اسمت
• چه کاری میتونی
• خداحافظ

💡 می‌توانید سوالات خود را به فارسی بپرسید!"""
    
    def train(self, questions, answers):
        """آموزش مدل با داده‌های جدید"""
        for q, a in zip(questions, answers):
            self.knowledge[q.lower()] = a
        self.model_trained = True
        return {'status': 'success', 'trained': len(questions)}
    
    def chat(self, message):
        """پاسخ به پیام کاربر"""
        msg_lower = message.lower().strip()
        
        # ذخیره در تاریخچه
        self.conversation_history.append({
            'time': time.time(),
            'user': message,
            'response': None
        })
        
        # جستجو در دانش
        for key, response in self.knowledge.items():
            if key in msg_lower:
                self.conversation_history[-1]['response'] = response
                return response
        
        # پاسخ پیشفرض
        response = f"🤖 پیام شما دریافت شد: «{message[:100]}»\n(برای راهنما بگویید «راهنما»)"
        self.conversation_history[-1]['response'] = response
        return response
    
    def analyze_sentiment(self, text):
        """تحلیل احساسات متن (ساده)"""
        positive = ['خوب', 'عالی', 'عشق', 'عالیه', 'ممنون']
        negative = ['بد', 'خراب', 'اشتباه', 'مشکل', 'ناراحت']
        
        text_lower = text.lower()
        pos_score = sum(1 for w in positive if w in text_lower)
        neg_score = sum(1 for w in negative if w in text_lower)
        
        if pos_score > neg_score:
            return 'positive', 0.7 + (pos_score * 0.1)
        elif neg_score > pos_score:
            return 'negative', 0.6 + (neg_score * 0.1)
        else:
            return 'neutral', 0.5
    
    def get_stats(self):
        return {
            'knowledge_size': len(self.knowledge),
            'conversations': len(self.conversation_history),
            'trained': self.model_trained,
            'has_ai_lite': self.has_ai_lite
        }

# ========== راه‌اندازی مدل ==========
ai = ImanAIModel()
print('🧠 ImanAI Model initialized')

# ========== پردازش درخواست ==========
action = os.environ.get('ACTION_TYPE', '')
message = os.environ.get('USER_MESSAGE', '')
request_id = os.environ.get('REQUEST_ID', str(int(time.time())))

result = {'request_id': request_id, 'timestamp': time.time()}

if action == 'chat':
    # حالت مکالمه
    response = ai.chat(message)
    result['response'] = response
    result['sentiment'] = ai.analyze_sentiment(message)
    result['stats'] = ai.get_stats()
    print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')

elif action == 'train':
    # حالت آموزش
    train_data = os.environ.get('TRAIN_DATA', '{}')
    try:
        data = json.loads(train_data)
        questions = data.get('questions', [])
        answers = data.get('answers', [])
        train_result = ai.train(questions, answers)
        result['training'] = train_result
        print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')
    except:
        result['error'] = 'Invalid training data'
        print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')

elif action == 'status':
    # حالت وضعیت
    result['status'] = 'online'
    result['stats'] = ai.get_stats()
    print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')

elif action == 'analyze':
    # حالت تحلیل متن
    sentiment = ai.analyze_sentiment(message)
    result['sentiment'] = sentiment
    result['message'] = message[:200]
    print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')

else:
    result['error'] = f'Unknown action: {action}'
    result['available_actions'] = ['chat', 'train', 'status', 'analyze']
    print(f'RESPONSE::{urllib.parse.quote(json.dumps(result))}')

print('✅ Request processed')
"
      
      - name: 📤 برگرداندن پاسخ
        run: |
          RESPONSE=$(grep -oP 'RESPONSE::\K.*' <<< "${{ steps.run.outputs.stdout }}" | head -1)
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          
          # اگر callback_url وجود داشت، پاسخ رو به اونجا هم بفرست
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          if [ -n "$CALLBACK_URL" ]; then
            curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"request_id\":\"${{ github.event.client_payload.request_id }}\",\"response\":\"$RESPONSE\"}"
          fi
